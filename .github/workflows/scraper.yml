name: Football Scraper Production V3 

on:
schedule:
- cron: '0 2 * * *'
workflow_dispatch: 

permissions:
contents: write 

jobs:
run-pipeline:
runs-on: ubuntu-latest 

steps:

* name: Checkout Repository Context
uses: actions/checkout@v4
with:
ref: ${{ github.ref_name }}
fetch-depth: 0
clean: true
* name: Configure Python Environment
uses: actions/setup-python@v5
with:
python-version: '3.11'
cache: 'pip'
* name: Inject Stealth Dependencies
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
* name: Execute Stealth Data Pipeline
run: python run_scraper.py
* name: Commit and Push Newly Extracted Telemetry
run: |
git config --global user.name "SofaScore Pipeline Bot"
git config --global user.email "github-actions[bot]@users.noreply.github.com"

mkdir -p data/historical data/upcoming
git add data/

if git diff --staged --quiet; then
echo "No new fixture differences found. Skipping tree push."
else
git commit -m "Automated Proxy Pipeline Sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
git push origin HEAD:${{ github.ref_name }}
fi
