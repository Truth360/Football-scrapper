name: Automated SofaScore Data Engine

on:
  schedule:
    # Runs automatically once every day at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the machine at any time via GitHub web UI

permissions:
  contents: write # Grants the runner permission to commit data files back to repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Context
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Inject Stealth Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Stealth Data Pipeline
      run: python run_scraper.py

    - name: Commit and Push Newly Extracted Telemetry
      run: |
        git config --global user.name "SofaScore Pipeline Bot"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Safely stage the entire data directory and all dynamically created JSON files
        git add data/
        
        # Only commit if actual delta changes exist
        if git diff --staged --quiet; then
          echo "No new fixture differences found. Skipping tree push."
        else
          git commit -m "Automated Pipeline Sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
        fi
